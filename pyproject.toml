[project]
name = "medallion-etl"
version = "0.1.0"
description = "Medallion ETL with Pandera + Pydantic stage gates"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pandera[pandas]>=0.20",
    "pydantic>=2.7",
    "deltalake>=0.18",
    "fsspec>=2024.6",
    "s3fs>=2024.6",
    "structlog>=24.1",
    "typer>=0.12",
    "psutil>=7.2.2",
]

[project.scripts]
medallion-etl = "medallion_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "ipykernel>=6",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medallion_etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PD"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pandera.mypy", "pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
