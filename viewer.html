<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>medallion · pipeline logger</title>
<style>
  :root {
    --bg: #0e1217;
    --panel: #161b22;
    --panel-2: #1c222b;
    --border: #2a313c;
    --text: #d8dee5;
    --muted: #7d8590;
    --green: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --gray: #4a525c;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    font-size: 13px;
    display: grid;
    grid-template-rows: 64px 1fr;
    grid-template-columns: 280px 1fr 220px;
    grid-template-areas: "logo header header" "rail detail actions";
    transition: grid-template-columns 0.2s ease;
  }
  body.actions-collapsed {
    grid-template-columns: 280px 1fr 36px;
  }
  header.top {
    grid-area: header;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 40px;
  }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .meta-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .meta-value { font-size: 14px; font-weight: 500; }
  .layer-bar {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .layer-bar .seg {
    width: 28px; height: 4px;
    background: var(--gray); border-radius: 2px;
  }
  .layer-bar .seg.success { background: var(--green); }
  .layer-bar .seg.error { background: var(--red); }
  .layer-bar .seg.running { background: var(--red); animation: pulse 1.2s ease-in-out infinite; }
  .layer-bar .label { color: var(--muted); margin-left: 8px; font-size: 12px; }

  .logo {
    grid-area: logo;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px;
  }
  .logo .plus {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--green);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 300;
  }
  .logo .name { font-weight: 600; font-size: 14px; }
  .logo .tag { font-size: 9px; color: var(--muted); letter-spacing: 0.18em; }

  aside.rail {
    grid-area: rail;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 12px;
  }
  .exec-picker {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 8px;
    font: inherit;
  }
  .overview-btn {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px;
    margin-bottom: 14px;
    font: inherit; font-size: 11px; font-weight: 500;
    text-align: left;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.1s, border-color 0.1s;
  }
  .overview-btn:hover { background: var(--panel-2); border-color: var(--muted); }
  .overview-btn.active { border-color: var(--orange); color: var(--orange); }
  .overview-btn .ico {
    font-size: 13px;
  }

  .layer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .layer.error { border-color: rgba(248,81,73,0.35); }
  .layer-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    user-select: none;
    cursor: pointer;
  }
  .layer-head:hover { background: var(--panel-2); }
  .layer.selected > .layer-head { background: var(--panel-2); }
  .layer-head .caret {
    font-size: 9px; color: var(--muted);
    display: inline-block; transition: transform 0.15s ease;
    width: 12px; text-align: center;
    cursor: pointer;
  }
  .layer.collapsed .layer-head .caret { transform: rotate(-90deg); }
  .layer.collapsed .steps { display: none; }
  .layer-head .icon { font-size: 14px; display: inline-flex; align-items: center; }
  .layer-head .icon img { width: 18px; height: 18px; display: block; image-rendering: pixelated; }
  .layer-head .name {
    font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    flex: 1;
  }
  .layer-head .status-dot { margin-left: auto; }

  .steps { padding: 4px 0 8px 0; border-top: 1px solid var(--border); }
  .step {
    position: relative;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 30px;
    cursor: pointer;
    border-left: 2px solid transparent;
    font-size: 12px;
  }
  .step:hover { background: var(--panel-2); }
  .step.selected { background: var(--panel-2); border-left-color: var(--red); }
  .step .step-name { flex: 1; }
  .step.pending .step-name { color: var(--muted); }
  .step .transform-badge {
    font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 3px;
    background: rgba(110,158,255,0.12); color: #6e9eff; font-weight: 700;
  }
  /* Chevron floats to the LEFT of the row, outside the regular content flow,
     so transform steps stay vertically-aligned with regular steps (no
     visible indent). */
  .step .step-caret {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 9px; color: var(--muted);
    width: 12px; text-align: center; cursor: pointer;
    transition: transform 0.15s ease;
    z-index: 1;
  }
  .step.collapsed .step-caret { transform: translateY(-50%) rotate(-90deg); }
  .step.collapsed + .pipes { display: none; }

  .pipes {
    border-left: 1.5px solid var(--border);
    margin: 2px 0 4px 38px;
    padding: 2px 0 2px 0;
  }
  .pipe {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 14px 4px 10px;
    cursor: pointer; font-size: 11px;
    color: var(--text);
    border-left: 2px solid transparent;
    margin-left: -1.5px;
  }
  .pipe:hover { background: var(--panel-2); }
  .pipe.selected { background: var(--panel-2); border-left-color: var(--red); }
  .pipe .pipe-name { flex: 1; }
  .pipe.pending .pipe-name { color: var(--muted); }
  .pipe .pipe-dur { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .pipe .dot { width: 7px; height: 7px; border-width: 1.2px; }

  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid transparent;
  }
  .dot.success { background: var(--green); }
  .dot.error { background: var(--red); }
  /* Running dot stays SOLID (no opacity flash); a ripple ring expands and fades
     around it via box-shadow. Same effect as the layer-row timeline dot. */
  .dot.running { background: var(--orange); border-color: var(--orange); animation: dot-ring 1.4s ease-out infinite; }
  .dot.pending { background: transparent; border-color: var(--gray); }
  .dot.skipped { background: var(--gray); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Outer execution timeline left of layer cards.
     We wrap each .layer in a .layer-row whose ::before is the dot and ::after
     is the colored progress segment running down to the next dot. The card
     itself keeps `overflow: hidden` (to clip its rounded corners) — the
     wrapper, which does NOT clip, hosts the indicators so they actually show. */
  .timeline { position: relative; padding-left: 20px; }
  /* Faint background track — visible only where no progress segment covers it.
     Integer-pixel alignment: 10px dot at left:-20 spans columns -20..-11
     (center BETWEEN -16 and -15); 2px bar at left:-16 spans -16..-15 (center
     between -16 and -15) → matches dot center exactly.
     Track at .timeline-left + 4 (width 2 → between columns 4 and 5);
     row left = .timeline + 20, so dot center is at .timeline +4..+5 → matches. */
  .timeline::before {
    content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px;
    width: 2px; background: var(--border); opacity: 0.4;
  }
  .layer-row { position: relative; margin-bottom: 10px; }
  .layer-row > .layer { margin-bottom: 0; }
  /* Smooth entry when a new layer becomes visible mid-run. Applied only the
     first time we render a given layer (see renderRail / state.animatedLayers);
     subsequent re-renders skip the class so existing rows don't re-animate. */
  .layer-row.layer-row-new {
    animation: layer-appear 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
  }
  @keyframes layer-appear {
    0%   { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .layer-row::before {
    content: ""; position: absolute;
    left: -20px; top: 13px; width: 10px; height: 10px; border-radius: 50%;
    background: transparent; border: 1.5px solid var(--gray);
    z-index: 2;
    transition: background 0.2s, border-color 0.2s;
  }
  .layer-row.success::before { background: var(--green); border-color: var(--green); }
  .layer-row.error::before   { background: var(--red);   border-color: var(--red); }
  /* Running: dot is SOLID (no fading), surrounded by a ring that grows and
     fades — a "ripple" pulse driven by an expanding box-shadow. */
  .layer-row.running::before {
    background: var(--orange);
    border-color: var(--orange);
    animation: dot-ring 1.4s ease-out infinite;
  }
  @keyframes dot-ring {
    0%   { box-shadow: 0 0 0 0px rgba(210,153,34, 0.65); }
    70%  { box-shadow: 0 0 0 8px rgba(210,153,34, 0); }
    100% { box-shadow: 0 0 0 0px rgba(210,153,34, 0); }
  }
  /* Connector segment from this layer's dot to the next layer's dot, colored
     by THIS layer's status. Vertically: starts at top:13 (inside the dot, so
     no gap at the top) and ends at bottom:-26 (overlaps into next dot for a
     continuous look across rows). */
  .layer-row::after {
    content: ""; position: absolute;
    left: -16px; top: 13px; bottom: -26px;
    width: 2px; background: var(--gray); opacity: 0.4;
    z-index: 1;
    transition: background 0.2s, opacity 0.2s;
  }
  .layer-row:last-child::after { display: none; }
  .layer-row.success::after { background: var(--green); opacity: 1; }
  .layer-row.error::after   { background: var(--red);   opacity: 1; }
  .layer-row.running::after {
    background: linear-gradient(to bottom, var(--orange) 0%, var(--orange) 60%, var(--gray) 100%);
    opacity: 1;
    animation: pulse 1.2s ease-in-out infinite;
  }

  section.detail {
    grid-area: detail;
    padding: 28px 32px;
    overflow-y: auto;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    max-width: 480px;
    gap: 18px 32px;
    margin-bottom: 28px;
  }
  .detail-grid .label { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .detail-grid .value { font-size: 15px; font-weight: 500; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }
  .pill.error { background: rgba(248,81,73,0.15); color: var(--red); }
  .pill.success { background: rgba(63,185,80,0.15); color: var(--green); }
  .pill.running { background: rgba(210,153,34,0.15); color: var(--orange); }
  .pill.pending { background: var(--panel); color: var(--muted); }

  .err-title {
    color: var(--red);
    font-size: 13px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .err-box {
    border: 1px solid rgba(248,81,73,0.4);
    border-radius: 8px;
    padding: 18px 22px;
    background: rgba(248,81,73,0.04);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .err-box .file-line { color: var(--text); }
  .err-box .file-path { color: #6e9eff; }
  .err-box .file-num { color: var(--orange); }
  .err-box .ftype { color: #d2a8ff; }
  .err-box .err-line { color: var(--red); margin: 6px 0; }
  .err-box .ctx { color: var(--red); }
  .err-box .hint { color: var(--text); margin-top: 8px; }

  /* Layer flow diagram (right pane when a layer is selected) */
  .flow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: stretch;
    margin-top: 8px;
  }
  .flow-arrow {
    display: flex; align-items: center;
    color: var(--muted); font-size: 18px; padding: 0 2px;
    user-select: none;
  }
  .flow-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left-width: 3px;
    border-radius: 6px;
    padding: 10px 14px;
    /* Normal step boxes size to their content; transform boxes have a
       slightly larger floor so the pipe column inside has room to breathe. */
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
    align-self: flex-start;
    display: flex; flex-direction: column;
  }
  .flow-box:hover { background: var(--panel-2); }
  .flow-box.success  { border-left-color: var(--green); }
  .flow-box.error    { border-left-color: var(--red); }
  .flow-box.running  { border-left-color: var(--orange); }
  .flow-box.pending  { border-left-color: var(--gray); }
  .flow-box-head {
    display: flex; align-items: center; gap: 8px;
    font-weight: 500; font-size: 13px;
  }
  .flow-box-meta {
    font-size: 11px; color: var(--muted);
    margin-top: 6px; font-family: var(--mono);
  }
  .flow-box.has-pipes { min-width: 200px; }
  .flow-box .transform-badge {
    font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 3px;
    background: rgba(110,158,255,0.12); color: #6e9eff; font-weight: 700;
    margin-left: auto;
  }

  /* Transform-step pipes stack VERTICALLY inside the box; if many pipes,
     the column scrolls internally rather than stretching the box (or the
     whole row) to fit. */
  .flow-pipes {
    display: flex; flex-direction: column;
    gap: 6px; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--border);
    max-height: 260px; overflow-y: auto;
    /* Visual hint that the area scrolls. */
    padding-right: 2px;
  }
  .flow-pipe {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left-width: 2px;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color 0.1s, background 0.1s;
  }
  .flow-pipe:hover { background: rgba(255,255,255,0.04); }
  .flow-pipe.success  { border-left-color: var(--green); }
  .flow-pipe.error    { border-left-color: var(--red); }
  .flow-pipe.running  { border-left-color: var(--orange); }
  .flow-pipe.pending  { border-left-color: var(--gray); }
  .flow-pipe-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500;
  }
  .flow-pipe-head .dot { width: 7px; height: 7px; border-width: 1.2px; }
  .flow-pipe-meta {
    font-size: 10px; color: var(--muted);
    margin-top: 3px; font-family: var(--mono);
  }
  /* No inter-pipe arrow in the vertical column layout. */
  .flow-pipe-arrow { display: none; }

  section.detail a {
    color: #6e9eff;
    text-decoration: none;
    border-bottom: 1px dotted rgba(110,158,255,0.4);
  }
  section.detail a:hover { border-bottom-color: #6e9eff; }

  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 60px 0;
    text-align: center;
  }

  /* Schema-drift section in the run overview. */
  .drift-section { margin-top: 22px; }
  .drift-heading {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .drift-heading .vs { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
  .drift-card {
    background: var(--panel); border: 1px solid var(--border);
    border-left: 3px solid var(--orange);
    border-radius: 6px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .drift-card.new { border-left-color: var(--green); }
  .drift-card.error { border-left-color: var(--red); }
  .drift-card-head {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 500; margin-bottom: 6px;
  }
  .drift-card-head .label { font-weight: 600; }
  .drift-card-head .tag {
    font-size: 9px; padding: 1px 6px; border-radius: 3px; letter-spacing: 0.06em;
    text-transform: uppercase; font-weight: 700;
    background: rgba(210,153,34,0.15); color: var(--orange);
  }
  .drift-card-head .tag.new { background: rgba(63,185,80,0.15); color: var(--green); }
  .drift-changes {
    font-size: 11px; color: var(--text); font-family: var(--mono);
    line-height: 1.7;
  }
  .drift-changes .add { color: var(--green); }
  .drift-changes .rem { color: var(--red); }
  .drift-changes .chg { color: var(--orange); }
  .drift-changes .key { color: var(--muted); }
  .drift-badge {
    font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 3px; font-weight: 700;
    background: rgba(210,153,34,0.15); color: var(--orange);
  }

  /* Sample / quarantine viewer — inline parquet table loaded via /parquet. */
  .sample-section { margin-top: 22px; }
  .sample-heading {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px;
  }
  .sample-toolbar {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
  }
  .sample-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 5px 10px; font: inherit; font-size: 11px; border-radius: 5px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.1s, border-color 0.1s;
  }
  .sample-btn:hover { background: var(--panel-2); border-color: var(--muted); }
  .sample-btn.quarantine { border-left: 3px solid var(--red); }
  .sample-btn.active { background: var(--panel-2); border-color: var(--orange); }
  .sample-btn .icon { color: var(--muted); }
  .sample-status {
    font-size: 10px; color: var(--muted); font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .sample-table-wrap {
    overflow: auto; max-height: 320px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel);
  }
  table.sample-table {
    width: 100%; border-collapse: collapse; font-size: 11px;
  }
  table.sample-table th, table.sample-table td {
    padding: 6px 10px; text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; font-family: var(--mono);
  }
  table.sample-table thead th {
    position: sticky; top: 0; background: var(--panel-2); color: var(--muted);
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
    font-weight: 600; z-index: 1;
  }
  table.sample-table tbody tr:hover { background: var(--panel-2); }
  table.sample-table td .nullv { color: var(--muted); font-style: italic; }
  table.sample-table td code {
    font-size: 10px; padding: 1px 4px; background: var(--bg);
    border-radius: 3px; color: var(--text);
  }

  /* Waterfall — Gantt-style timeline of step+pipe intervals for a run. */
  .waterfall {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .waterfall-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px; gap: 12px;
  }
  .waterfall-head h3 {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .waterfall-head .total {
    font-size: 11px; color: var(--muted); font-family: var(--mono);
  }
  .wf-row {
    display: grid;
    grid-template-columns: 200px 1fr 80px;
    align-items: center;
    gap: 10px;
    padding: 3px 0;
    cursor: pointer;
    border-radius: 4px;
  }
  .wf-row:hover { background: var(--panel-2); }
  .wf-row.pipe { padding-left: 18px; }
  .wf-row.pipe .wf-label { font-size: 11px; color: var(--muted); }
  .wf-label {
    font-size: 12px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 8px;
  }
  .wf-label .layer-tag {
    font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); flex-shrink: 0;
  }
  .wf-track {
    position: relative;
    height: 18px;
    background: rgba(255,255,255,0.02);
    border-radius: 3px;
  }
  .wf-bar {
    position: absolute; top: 2px; bottom: 2px;
    border-radius: 3px;
    background: var(--gray);
    transition: opacity 0.1s;
    min-width: 2px;
  }
  .wf-bar.success { background: var(--green); }
  .wf-bar.error { background: var(--red); }
  .wf-bar.running { background: var(--orange); animation: pulse 1.2s ease-in-out infinite; }
  .wf-bar.pipe { top: 4px; bottom: 4px; opacity: 0.7; }
  .wf-row:hover .wf-bar { opacity: 1; }
  .wf-dur {
    font-size: 11px; font-family: var(--mono); color: var(--muted);
    text-align: right;
  }
  .wf-axis {
    display: grid;
    grid-template-columns: 200px 1fr 80px;
    gap: 10px;
    font-size: 10px; color: var(--muted); font-family: var(--mono);
    padding-top: 6px; margin-top: 8px;
    border-top: 1px solid var(--border);
  }
  .wf-axis-ticks {
    display: flex; justify-content: space-between;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Bottom-centered usage dock — slides up from below with an animation.
     Horizontally centered via translateX(-50%); the slide-up motion combines
     the centering translate with a Y offset so we use a single transform. */
  .usage-dock {
    position: fixed;
    bottom: 0;
    left: 50%;
    width: 480px;
    height: 340px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.35);
    z-index: 50;
    /* When closed, only the 36px header pokes out from the bottom of the window. */
    transform: translate(-50%, calc(100% - 36px));
    transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
    display: flex; flex-direction: column;
  }
  .usage-dock.open { transform: translate(-50%, 0); }
  .usage-dock-head {
    height: 36px; flex-shrink: 0;
    padding: 0 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
    border-radius: 8px 8px 0 0;
    transition: background 0.12s;
  }
  .usage-dock-head:hover { background: rgba(255,255,255,0.05); }
  .usage-dock-title {
    flex: 1;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text);
  }
  .usage-dock-caret {
    color: var(--muted); font-size: 11px;
    transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .usage-dock.open .usage-dock-caret { transform: rotate(180deg); }
  .usage-tabs {
    display: flex; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .usage-tab {
    flex: 1;
    background: transparent; border: none; color: var(--muted);
    padding: 9px 0;
    font: inherit; font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .usage-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .usage-tab.active { color: var(--text); border-bottom-color: var(--orange); }
  .usage-body {
    flex: 1; overflow: hidden;
    padding: 14px 14px 12px 14px;
    position: relative;
  }
  .usage-pane { display: none; height: 100%; flex-direction: column; gap: 10px; }
  .usage-pane.active { display: flex; }
  .usage-pane svg { flex: 1; width: 100%; display: block; }
  .usage-stats {
    display: flex; gap: 18px; flex-shrink: 0;
    font-size: 11px; color: var(--muted); font-family: var(--mono);

  .disk-kpi {
    display: flex; flex-direction: column; gap: 18px;

  .disk-bar {

  .disk-bar-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: linear-gradient(90deg, var(--green) 0%, var(--orange) 75%, var(--red) 100%);
    transition: width 0.4s ease;

  .disk-bar-label {

  .disk-num-row {

  .disk-num { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .disk-num .label {

  /* Right actions sidebar */
  aside.actions {

  .config-body {

  .config-row { display: flex; flex-direction: column; gap: 6px; }
  .config-label {

  .seg-group {

    overflow: hidden;
    background: var(--panel-2);
  }
  .seg {
    flex: 1;
    background: transparent; border: none;
    border-right: 1px solid var(--border);

    padding: 6px 0;
    font: inherit; font-size: 11px;

  }
  .seg:last-child { border-right: none; }
  .seg:hover { background: var(--bg); color: var(--text); }
  .seg.active { background: var(--orange); color: #0e1217; font-weight: 600; }
  .seg[data-fsz="sm"] { font-size: 10px; }
  .seg[data-fsz="md"] { font-size: 12px; }
  .seg[data-fsz="lg"] { font-size: 14px; }

  /* Font-size scaling via CSS `zoom` (cleanest cross-element scaler). */
  body.fsz-sm { zoom: 0.9; }
  body.fsz-md { zoom: 1; }
  body.fsz-lg { zoom: 1.15; }

  /* Light theme — overrides the CSS variables defined on :root. */
  body.theme-light {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #eef1f5;
    --border: #d0d7de;

  body.theme-light .run-btn:hover { background: var(--bg); }
  body.theme-light .disk-bar-label { text-shadow: none; }
</style>

<script>
const LOGS_DIR = "data/_logs";
const POLL_INDEX_MS = 3000;
const POLL_RUN_MS = 2000;

const state = {
  executions: [],     // from index.json
  selectedExecId: null,
  selectedStepId: null,
  selectedPipeId: null,
  selectedLayerOrder: null,
  collapsedLayers: new Set(),
  collapsedSteps: new Set(),
  animatedLayers: new Set(),
  run: null,          // { meta, layers: Map<order, layerObj>, byStepId: Map }
  usage: [],          // array of usage samples for the selected execution
};

// ---------- fetch helpers ----------
async function fetchJSON(url) {
  const res = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function fetchJSONL(url) {
  const res = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  const text = await res.text();
  const out = [];
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    try { out.push(JSON.parse(line)); } catch (_) { /* tolerate trailing partial */ }
  }
  return out;
}

// ---------- replay events into a render model ----------
function buildRunModel(events) {
  const meta = { execStarted: null, execFinished: null, status: "pending", durationMs: null, layersCompleted: 0, layersSeen: 0, pipeline: null };
  const layers = new Map();      // layer_order -> { order, name, status, steps: Map }
  const byStepId = new Map();    // stepId -> stepObj

  for (const ev of events) {
    if (ev.event === "execution_started") {
      meta.execStarted = ev.ts;
      meta.status = "running";
      meta.pipeline = ev.pipeline;
    } else if (ev.event === "execution_finished") {
      meta.execFinished = ev.ts;
      meta.status = ev.status || "success";
      meta.durationMs = ev.duration_ms ?? null;
      meta.layersCompleted = ev.layers_completed ?? 0;
      meta.layersSeen = ev.layers_seen ?? 0;
    } else if (ev.event === "step_started" || ev.event === "step_finished") {
      const lo = ev.layer_order;
      if (!layers.has(lo)) {
        layers.set(lo, { order: lo, name: ev.layer, status: "pending", steps: new Map() });
      }
      const layer = layers.get(lo);
      const sid = ev.step_id;
      let step = byStepId.get(sid);
      if (!step) {
        step = {
          id: sid, name: ev.step_name, layer: ev.layer, layerOrder: lo, order: ev.step_order,
          description: null,
          status: "pending", durationMs: null, rowsIn: null, rowsOut: null, error: null, extra: {},
          pipes: new Map(),
        };
        byStepId.set(sid, step);
        layer.steps.set(ev.step_order, step);
      }
      if (ev.description != null) step.description = ev.description;
      if (ev.event === "step_started") {
        step.status = "running";
        step.startTs = ev.ts;
        if (ev.rows_in != null) step.rowsIn = ev.rows_in;
      } else {
        step.status = ev.status || "success";
        step.endTs = ev.ts;
        step.durationMs = ev.duration_ms ?? null;
        if (ev.rows_in != null) step.rowsIn = ev.rows_in;
        if (ev.rows_out != null) step.rowsOut = ev.rows_out;
        if (ev.error) step.error = ev.error;
        // collect any extra fields (output_path, source_file, quarantined, etc.)
        const standard = new Set(["ts","execution_id","pipeline","event","level","status","layer","layer_order","step_id","step_name","step_order","description","duration_ms","rows_in","rows_out","error"]);
        for (const [k, v] of Object.entries(ev)) {
          if (!standard.has(k)) step.extra[k] = v;
        }
      }
    } else if (ev.event === "pipe_started" || ev.event === "pipe_finished") {
      // Sub-step of an active step (e.g. functions chained with .pipe()).
      const lo = ev.layer_order;
      if (!layers.has(lo)) {
        layers.set(lo, { order: lo, name: ev.layer, status: "pending", steps: new Map() });
      }
      const layer = layers.get(lo);
      const sid = ev.step_id;
      let parent = byStepId.get(sid);
      if (!parent) {
        // pipe arrived before its step_started — synthesize a placeholder.
        parent = {
          id: sid, name: sid, layer: ev.layer, layerOrder: lo, order: -1,
          description: null, status: "pending",
          durationMs: null, rowsIn: null, rowsOut: null, error: null, extra: {},
          pipes: new Map(),
        };
        byStepId.set(sid, parent);
        layer.steps.set(-1, parent);
      }
      if (!parent.pipes) parent.pipes = new Map();
      const pid = ev.pipe_id;
      let pipe = parent.pipes.get(pid);
      if (!pipe) {
        pipe = {
          id: pid, name: ev.pipe_name || pid, order: ev.pipe_order ?? 0,
          description: ev.description || null,
          status: "pending", durationMs: null, rowsIn: null, rowsOut: null, error: null,
        };
        parent.pipes.set(pid, pipe);
      }
      if (ev.description != null) pipe.description = ev.description;
      if (ev.event === "pipe_started") {
        pipe.status = "running";
        pipe.startTs = ev.ts;
        if (ev.rows_in != null) pipe.rowsIn = ev.rows_in;
      } else {
        pipe.status = ev.status || "success";
        pipe.endTs = ev.ts;
        pipe.durationMs = ev.duration_ms ?? null;
        if (ev.rows_in != null) pipe.rowsIn = ev.rows_in;
        if (ev.rows_out != null) pipe.rowsOut = ev.rows_out;
        if (ev.error) pipe.error = ev.error;
      }
    }
  }

  // derive layer status: error if any error step; else running if any running; else success if all success; else pending
  for (const layer of layers.values()) {
    const steps = [...layer.steps.values()];
    if (steps.some(s => s.status === "error")) layer.status = "error";
    else if (steps.some(s => s.status === "running")) layer.status = "running";
    else if (steps.length && steps.every(s => s.status === "success")) layer.status = "success";
    else layer.status = "pending";
  }

  return { meta, layers, byStepId };
}

// ---------- rendering ----------
function fmtDuration(ms) {
  if (ms == null) return "—";
  if (ms < 1000) return `${ms}ms`;
  const s = ms / 1000;
  if (s < 60) return `${s.toFixed(1)}s`;
  const m = Math.floor(s / 60);
  const r = Math.round(s - m * 60);
  return `${m}min ${r.toString().padStart(2, "0")}s`;
}
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const LAYER_ICON = {
  landing: "📈",
  bronze: `<img src="public/png/bronze_ingot.png" alt="bronze">`,
  silver: `<img src="public/png/silver_ingot.png" alt="silver">`,
  gold:   `<img src="public/png/gold_ingot.png" alt="gold">`,
};

function renderHeader(run) {
  document.getElementById("meta-date").textContent = fmtDate(run?.meta?.execStarted);
  document.getElementById("meta-id").textContent = state.selectedExecId != null ? `#${state.selectedExecId}` : "—";

  const bar = document.getElementById("layer-bar");
  bar.innerHTML = "";
  const layerArr = run ? [...run.layers.values()].sort((a,b)=>a.order-b.order) : [];
  // pad to known total; if no layer_seen meta yet, just show what we have
  for (const l of layerArr) {
    const seg = document.createElement("div");
    seg.className = `seg ${l.status}`;
    bar.appendChild(seg);
  }
  if (layerArr.length) {
    const completed = layerArr.filter(l => l.status === "success").length;
    const total = run.meta.layersSeen || layerArr.length;
    const lbl = document.createElement("div");
    lbl.className = "label";
    lbl.textContent = `${completed}/${total} layers`;
    bar.appendChild(lbl);
  }
}

function renderRail(run) {
  const root = document.getElementById("layers");
  root.innerHTML = "";
  const overviewBtn = document.getElementById("overview-btn");
  if (overviewBtn) {
    overviewBtn.classList.toggle("active",
      state.selectedStepId == null && state.selectedLayerOrder == null);
  }
  if (!run) return;
  const layerArr = [...run.layers.values()].sort((a,b)=>a.order-b.order);
  for (const layer of layerArr) {
    // Wrapper hosts the timeline dot + progress segment (un-clipped), so they
    // stay visible even though the card itself uses overflow:hidden.
    const row = document.createElement("div");
    const isFirstAppearance = !state.animatedLayers.has(layer.order);
    if (isFirstAppearance) state.animatedLayers.add(layer.order);
    row.className = `layer-row ${layer.status}${isFirstAppearance ? " layer-row-new" : ""}`;
    const card = document.createElement("div");
    const isCollapsed = state.collapsedLayers.has(layer.order);
    const isSelected = state.selectedLayerOrder === layer.order && state.selectedStepId == null;
    card.className = `layer ${layer.status} ${isCollapsed ? "collapsed" : ""} ${isSelected ? "selected" : ""}`;
    const icon = LAYER_ICON[layer.name] || "•";
    card.innerHTML = `
      <div class="layer-head">
        <span class="caret">▼</span>
        <span class="icon">${icon}</span>
        <span class="name">${escapeHtml(layer.name)}</span>
        <span class="dot ${layer.status}"></span>
      </div>
      <div class="steps"></div>`;
    const head = card.querySelector(".layer-head");
    const caret = card.querySelector(".caret");
    caret.addEventListener("click", (e) => {
      e.stopPropagation();
      if (state.collapsedLayers.has(layer.order)) state.collapsedLayers.delete(layer.order);
      else state.collapsedLayers.add(layer.order);
      renderRail(state.run);
    });
    head.addEventListener("click", () => {
      state.selectedLayerOrder = layer.order;
      state.selectedStepId = null;
      renderRail(state.run);
      renderDetail(state.run);
    });
    const stepsDiv = card.querySelector(".steps");
    const steps = [...layer.steps.values()].sort((a,b)=>a.order-b.order);
    for (const s of steps) {
      const row = document.createElement("div");
      const isStepSelected = state.selectedStepId === s.id && state.selectedPipeId == null;
      const hasPipes = s.pipes && s.pipes.size > 0;
      const isStepCollapsed = state.collapsedSteps.has(s.id);
      row.className = `step ${s.status} ${isStepSelected ? "selected" : ""} ${hasPipes && isStepCollapsed ? "collapsed" : ""}`;
      row.title = s.description || "";
      const caret = hasPipes ? `<span class="step-caret">▼</span>` : "";
      const badge = hasPipes ? `<span class="transform-badge">transform</span>` : "";
      row.innerHTML = `${caret}<span class="dot ${s.status}"></span><span class="step-name">${escapeHtml(s.name)}</span>${badge}`;
      row.addEventListener("click", (e) => {
        e.stopPropagation();
        state.selectedStepId = s.id;
        state.selectedPipeId = null;
        state.selectedLayerOrder = null;
        renderRail(state.run);
        renderDetail(state.run);
      });
      if (hasPipes) {
        const caretEl = row.querySelector(".step-caret");
        caretEl.addEventListener("click", (e) => {
          e.stopPropagation();
          if (state.collapsedSteps.has(s.id)) state.collapsedSteps.delete(s.id);
          else state.collapsedSteps.add(s.id);
          renderRail(state.run);
        });
      }
      stepsDiv.appendChild(row);

      if (hasPipes) {
        const pipesDiv = document.createElement("div");
        pipesDiv.className = "pipes";
        if (isStepCollapsed) pipesDiv.style.display = "none";
        const pipes = [...s.pipes.values()].sort((a,b)=>a.order-b.order);
        for (const p of pipes) {
          const prow = document.createElement("div");
          const isPipeSelected = state.selectedPipeId === p.id;
          prow.className = `pipe ${p.status} ${isPipeSelected ? "selected" : ""}`;
          prow.title = p.description || "";
          const dur = p.durationMs != null ? fmtDuration(p.durationMs) : "";
          prow.innerHTML = `<span class="dot ${p.status}"></span><span class="pipe-name">${escapeHtml(p.name)}</span><span class="pipe-dur">${dur}</span>`;
          prow.addEventListener("click", (e) => {
            e.stopPropagation();
            state.selectedStepId = s.id;
            state.selectedPipeId = p.id;
            state.selectedLayerOrder = null;
            renderRail(state.run);
            renderDetail(state.run);
          });
          pipesDiv.appendChild(prow);
        }
        stepsDiv.appendChild(pipesDiv);
      }
    }
    row.appendChild(card);
    root.appendChild(row);
  }
}

function colorizeTraceback(tb) {
  const esc = escapeHtml(tb);
  return esc
    .replace(/^Traceback \(most recent call last\):/m, m => `<span class="err-line">${m}</span>`)
    .replace(/File "([^"]+)", line (\d+), in (\S+)/g,
      (_, f, n, fn) => `File <span class="file-path">"${f}"</span>, line <span class="file-num">${n}</span>, in <span class="ftype">${fn}</span>`)
    .replace(/^([A-Z][A-Za-z]*Error.*$)/m, m => `<span class="err-line">${m}</span>`);
}

function renderDetail(run) {
  const el = document.getElementById("detail");
  if (!run) { el.innerHTML = `<div class="empty">No execution selected.</div>`; return; }

  // Default view (no specific selection) — show the Run overview with waterfall.
  if (state.selectedStepId == null && state.selectedLayerOrder == null) {
    el.innerHTML = renderRunOverview(run);
    return;
  }

  // Layer-level view: render flow diagram of steps.
  if (state.selectedStepId == null && state.selectedLayerOrder != null) {
    const layer = run.layers.get(state.selectedLayerOrder);
    if (layer) { el.innerHTML = renderLayerFlow(layer); return; }
  }

  let step = state.selectedStepId ? run.byStepId.get(state.selectedStepId) : null;
  if (!step) { el.innerHTML = `<div class="empty">No steps yet.</div>`; return; }

  // Pipe-level view: render details of a specific pipe sub-step.
  if (state.selectedPipeId && step.pipes) {
    const pipe = step.pipes.get(state.selectedPipeId);
    if (pipe) { el.innerHTML = renderPipeDetail(step, pipe); return; }
  }

  // Transform-step view: when a step has pipes, show the pipe chain as a flow.
  if (step.pipes && step.pipes.size > 0) {
    el.innerHTML = renderTransformFlow(step);
    return;
  }

  const pillClass = step.status;
  const pillText = (step.status || "pending").toUpperCase();

  let body = `
    <div class="detail-grid">
      <div>
        <div class="label">Layer</div>
        <div class="value">${escapeHtml(capitalize(step.layer))}</div>
      </div>
      <div>
        <div class="label">Result</div>
        <div class="value"><span class="pill ${pillClass}">${pillText}</span></div>
      </div>
      <div>
        <div class="label">Pipe</div>
        <div class="value">${escapeHtml(step.name)}</div>
      </div>
      <div>
        <div class="label">Duration</div>
        <div class="value">${fmtDuration(step.durationMs)}</div>
      </div>`;
  if (step.description) {
    body += `
      <div style="grid-column: 1 / -1;">
        <div class="label">Description</div>
        <div class="value" style="font-weight: 400; font-size: 13px; color: var(--text); line-height: 1.5;">${escapeHtml(step.description)}</div>
      </div>`;
  }
  if (step.rowsIn != null || step.rowsOut != null) {
    body += `
      <div>
        <div class="label">Rows in</div>
        <div class="value">${step.rowsIn?.toLocaleString() ?? "—"}</div>
      </div>
      <div>
        <div class="label">Rows out</div>
        <div class="value">${step.rowsOut?.toLocaleString() ?? "—"}</div>
      </div>`;
  }
  body += `</div>`;

  if (step.error) {
    let extra = "";
    if (step.error.context) {
      const lines = Object.entries(step.error.context).map(([k,v]) =>
        `<div class="ctx">→ ${escapeHtml(prettyKey(k))}: ${formatValHtml(v)}</div>`).join("");
      extra = `\n${lines}`;
      if (step.error.context.hint) {
        // already included above; nothing extra
      }
    }
    body += `
      <div class="err-title">⚠ ERROR TRACE</div>
      <div class="err-box">${colorizeTraceback(step.error.traceback || "")}${extra}</div>`;
  } else if (Object.keys(step.extra).length) {
    const lines = Object.entries(step.extra).map(([k,v]) =>
      `<div><span style="color:var(--muted)">${escapeHtml(prettyKey(k))}:</span> ${formatValHtml(v)}</div>`).join("");
    body += `<div style="font-family: var(--mono); font-size: 12px; line-height: 1.8; color: var(--text); margin-top: 8px;">${lines}</div>`;
  }
  // Sample-rows section: any path-like extra (quarantine partition, silver/
  // gold output, etc.) gets a button to load + render an inline parquet table.
  const samplePaths = Object.entries(step.extra)
    .filter(([k, v]) => typeof v === "string" && pathToUrl(v));
  if (samplePaths.length) {
    const buttons = samplePaths.map(([k, v]) => {
      const isQ = k.toLowerCase().includes("quarantine");
      return `<button class="sample-btn ${isQ ? "quarantine" : ""}" data-sample-path="${escapeHtml(v)}" data-sample-key="${escapeHtml(k)}">
        <span class="icon">▦</span><span>${isQ ? "Sample quarantine" : "Sample " + escapeHtml(prettyKey(k))}</span>
      </button>`;
    }).join("");
    body += `
      <div class="sample-section">
        <div class="sample-heading">Sample rows</div>
        <div class="sample-toolbar">${buttons}</div>
        <div class="sample-status" id="sample-status"></div>
        <div id="sample-target"></div>
      </div>`;
  }
  el.innerHTML = body;
}

// ---------- inline parquet sample renderer ----------
async function loadParquetSample(path, key, clickedBtn) {
  const targetEl = document.getElementById("sample-target");
  const statusEl = document.getElementById("sample-status");
  if (!targetEl) return;
  document.querySelectorAll(".sample-btn").forEach(b => b.classList.remove("active"));
  if (clickedBtn) clickedBtn.classList.add("active");
  statusEl.textContent = `Loading ${key}…`;
  targetEl.innerHTML = "";
  try {
    const res = await fetch(`/parquet?path=${encodeURIComponent(path)}&limit=50`, { cache: "no-store" });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const data = await res.json();
    statusEl.textContent = `${data.total.toLocaleString()} rows total · showing ${data.rows.length} · ${data.columns.length} columns`;
    targetEl.innerHTML = renderParquetTable(data);
  } catch (err) {
    statusEl.textContent = "";
    targetEl.innerHTML = `<div class="empty" style="padding: 20px 0;">Failed to load: ${escapeHtml(err.message)}</div>`;
  }
}

function renderParquetTable(data) {
  const cols = data.columns || [];
  const rows = data.rows || [];
  if (!cols.length) return `<div class="empty" style="padding: 20px 0;">No columns.</div>`;
  const header = cols.map(c => `<th title="${escapeHtml(data.dtypes?.[c] || "")}">${escapeHtml(c)}</th>`).join("");
  const body = rows.map(r =>
    `<tr>${cols.map(c => `<td>${formatSampleCell(r[c])}</td>`).join("")}</tr>`,
  ).join("");
  return `<div class="sample-table-wrap">
    <table class="sample-table">
      <thead><tr>${header}</tr></thead>
      <tbody>${body}</tbody>
    </table>
  </div>`;
}

function formatSampleCell(v) {
  if (v == null) return '<span class="nullv">null</span>';
  if (typeof v === "object") {
    const s = JSON.stringify(v);
    return `<code>${escapeHtml(s.length > 140 ? s.slice(0, 137) + "…" : s)}</code>`;
  }
  const s = String(v);
  return escapeHtml(s.length > 140 ? s.slice(0, 137) + "…" : s);
}

function renderRunOverview(run) {
  const layerArr = [...run.layers.values()].sort((a,b)=>a.order-b.order);
  const totalSteps = layerArr.reduce((n, l) => n + l.steps.size, 0);
  const totalPipes = layerArr.reduce(
    (n, l) => n + [...l.steps.values()].reduce((m, s) => m + (s.pipes?.size || 0), 0), 0,
  );
  const drift = computeSchemaDrift();
  const driftedLabels = new Set(Object.entries(drift).filter(([, d]) => d.changed).map(([k]) => k));
  const layerSummary = layerArr.map(l => {
    const driftBadge = driftedLabels.has(l.name) ? `<span class="drift-badge">drift</span>` : "";
    return `<div class="flow-box ${l.status}" data-layer-order="${l.order}" style="cursor:pointer; min-width: 130px;">
       <div class="flow-box-head">
         <span class="dot ${l.status}"></span>
         <span>${escapeHtml(capitalize(l.name))}</span>
         ${driftBadge}
       </div>
       <div class="flow-box-meta">${l.steps.size} step${l.steps.size === 1 ? "" : "s"}</div>
     </div>`;
  }).join("");
  const status = run.meta.status;

  return `
    <div class="detail-grid">
      <div><div class="label">Pipeline</div><div class="value">${escapeHtml(run.meta.pipeline || "—")}</div></div>
      <div><div class="label">Result</div><div class="value"><span class="pill ${status}">${(status||"pending").toUpperCase()}</span></div></div>
      <div><div class="label">Duration</div><div class="value">${fmtDuration(run.meta.durationMs)}</div></div>
      <div><div class="label">Steps · pipes</div><div class="value">${totalSteps} · ${totalPipes}</div></div>
    </div>
    <h3 style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;">Layers</h3>
    <div class="flow">${layerSummary}</div>
    ${renderSchemaDrift(drift)}
    ${renderWaterfall(run)}
  `;
}

// Compare the currently-selected run's schema snapshots against the most
// recent earlier run that has a snapshot for the same label. Returns a map
// keyed by label with `{ changed, isNew, added, removed, dtypeChanged,
// rowsCurrent, rowsPrev, prevId }`.
function computeSchemaDrift() {
  const cur = state.executions.find(e => e.id === state.selectedExecId);
  const result = {};
  if (!cur || !cur.schemas) return result;
  // Earlier runs in id order (most recent first).
  const earlier = state.executions
    .filter(e => e.id < cur.id && e.schemas)
    .sort((a, b) => b.id - a.id);
  for (const [label, snap] of Object.entries(cur.schemas)) {
    const prev = earlier.find(e => e.schemas && e.schemas[label]);
    if (!prev) {
      result[label] = { changed: true, isNew: true };
      continue;
    }
    const p = prev.schemas[label];
    const curCols = new Set(snap.columns || []);
    const prevCols = new Set(p.columns || []);
    const added = [...curCols].filter(c => !prevCols.has(c));
    const removed = [...prevCols].filter(c => !curCols.has(c));
    const dtypeChanged = [];
    for (const c of curCols) {
      if (prevCols.has(c) && snap.dtypes?.[c] !== p.dtypes?.[c]) {
        dtypeChanged.push({ column: c, from: p.dtypes?.[c], to: snap.dtypes?.[c] });
      }
    }
    const changed = added.length || removed.length || dtypeChanged.length;
    result[label] = {
      changed: !!changed,
      isNew: false,
      added, removed, dtypeChanged,
      rowsCurrent: snap.row_count, rowsPrev: p.row_count,
      prevId: prev.id,
    };
  }
  return result;
}

function renderSchemaDrift(drift) {
  const labels = Object.keys(drift).filter(l => drift[l].changed);
  if (!labels.length) return "";
  const cards = labels.map(label => {
    const d = drift[label];
    if (d.isNew) {
      return `<div class="drift-card new">
        <div class="drift-card-head">
          <span class="label">${escapeHtml(capitalize(label))}</span>
          <span class="tag new">new snapshot</span>
        </div>
        <div class="drift-changes">No previous snapshot for this label — first run to record it.</div>
      </div>`;
    }
    const parts = [];
    if (d.added.length) {
      parts.push(`<div><span class="key">+ added:</span> <span class="add">${d.added.map(escapeHtml).join(", ")}</span></div>`);
    }
    if (d.removed.length) {
      parts.push(`<div><span class="key">− removed:</span> <span class="rem">${d.removed.map(escapeHtml).join(", ")}</span></div>`);
    }
    if (d.dtypeChanged.length) {
      parts.push(`<div><span class="key">~ dtypes:</span> <span class="chg">${
        d.dtypeChanged.map(x => `${escapeHtml(x.column)} (${escapeHtml(x.from)} → ${escapeHtml(x.to)})`).join("; ")
      }</span></div>`);
    }
    return `<div class="drift-card">
      <div class="drift-card-head">
        <span class="label">${escapeHtml(capitalize(label))}</span>
        <span class="tag">schema drift</span>
        <span class="key" style="margin-left: auto; font-size: 10px;">vs run #${d.prevId}</span>
      </div>
      <div class="drift-changes">${parts.join("")}</div>
    </div>`;
  }).join("");
  return `
    <div class="drift-section">
      <div class="drift-heading">Schema drift <span class="vs">— vs previous runs</span></div>
      ${cards}
    </div>`;
}

function renderWaterfall(run) {
  // Flatten all step + pipe intervals into rows; compute t0/tEnd in ms.
  const rows = [];
  let t0 = Infinity, tEnd = -Infinity;

  const layerArr = [...run.layers.values()].sort((a,b)=>a.order-b.order);
  for (const layer of layerArr) {
    const steps = [...layer.steps.values()].sort((a,b)=>a.order-b.order);
    for (const step of steps) {
      const start = step.startTs ? Date.parse(step.startTs) : null;
      const end = step.endTs ? Date.parse(step.endTs) : (step.status === "running" ? Date.now() : null);
      if (start != null) { t0 = Math.min(t0, start); }
      if (end != null) { tEnd = Math.max(tEnd, end); }
      rows.push({ kind: "step", layer: layer.name, step, start, end });
      const pipes = step.pipes ? [...step.pipes.values()].sort((a,b)=>a.order-b.order) : [];
      for (const pipe of pipes) {
        const pstart = pipe.startTs ? Date.parse(pipe.startTs) : null;
        const pend = pipe.endTs ? Date.parse(pipe.endTs) : (pipe.status === "running" ? Date.now() : null);
        if (pstart != null) { t0 = Math.min(t0, pstart); }
        if (pend != null) { tEnd = Math.max(tEnd, pend); }
        rows.push({ kind: "pipe", layer: layer.name, parent: step, pipe, start: pstart, end: pend });
      }
    }
  }

  if (!rows.length || !isFinite(t0) || !isFinite(tEnd) || tEnd <= t0) {
    return `<div class="waterfall"><div class="waterfall-head"><h3>Timing waterfall</h3></div><div class="empty" style="padding: 20px 0;">No timing data yet.</div></div>`;
  }

  const totalMs = tEnd - t0;
  const ticks = niceTicks(totalMs, 5);

  const rowsHtml = rows.map(r => {
    const start = r.start ?? t0;
    const end = r.end ?? tEnd;
    const leftPct = ((start - t0) / totalMs) * 100;
    const widthPct = Math.max(((end - start) / totalMs) * 100, 0.4);
    const status = (r.kind === "step" ? r.step.status : r.pipe.status) || "pending";
    const label = r.kind === "step" ? r.step.name : r.pipe.name;
    const dur = (r.kind === "step" ? r.step.durationMs : r.pipe.durationMs);
    const id = r.kind === "step" ? r.step.id : r.pipe.id;
    const parentId = r.kind === "pipe" ? r.parent.id : "";
    const tag = r.kind === "step" ? r.layer : "";
    const attrs = r.kind === "step"
      ? `data-step-id="${escapeHtml(id)}"`
      : `data-pipe-id="${escapeHtml(id)}" data-step-id="${escapeHtml(parentId)}"`;
    return `
      <div class="wf-row ${r.kind}" ${attrs} title="${escapeHtml(label)}${dur != null ? ` · ${fmtDuration(dur)}` : ""}">
        <div class="wf-label">
          ${tag ? `<span class="layer-tag">${escapeHtml(tag)}</span>` : ""}
          <span>${escapeHtml(label)}</span>
        </div>
        <div class="wf-track">
          <div class="wf-bar ${r.kind} ${status}" style="left: ${leftPct.toFixed(2)}%; width: ${widthPct.toFixed(2)}%;"></div>
        </div>
        <div class="wf-dur">${dur != null ? fmtDuration(dur) : "—"}</div>
      </div>`;
  }).join("");

  const tickLabels = ticks.map(t => fmtDuration(Math.round(t))).join("</span><span>");

  return `
    <div class="waterfall">
      <div class="waterfall-head">
        <h3>Timing waterfall</h3>
        <span class="total">total · ${fmtDuration(Math.round(totalMs))}</span>
      </div>
      <div class="wf-rows">${rowsHtml}</div>
      <div class="wf-axis">
        <div></div>
        <div class="wf-axis-ticks"><span>${tickLabels}</span></div>
        <div></div>
      </div>
    </div>`;
}

function niceTicks(maxMs, count) {
  const step = maxMs / (count - 1);
  return Array.from({length: count}, (_, i) => step * i);
}

function renderTransformFlow(step) {
  const pipes = [...step.pipes.values()].sort((a,b)=>a.order-b.order);
  const totalMs = pipes.reduce((sum, p) => sum + (p.durationMs ?? 0), 0);
  const status = step.status;

  const boxes = pipes.map((p, i) => {
    const meta = [
      p.durationMs != null ? fmtDuration(p.durationMs) : null,
      p.rowsIn != null ? `in ${p.rowsIn.toLocaleString()}` : null,
      p.rowsOut != null ? `out ${p.rowsOut.toLocaleString()}` : null,
    ].filter(Boolean).join(" · ");
    const box = `
      <div class="flow-box ${p.status}" data-pipe-id="${escapeHtml(p.id)}" data-step-id="${escapeHtml(step.id)}" title="${escapeHtml(p.description || "")}">
        <div class="flow-box-head">
          <span class="dot ${p.status}"></span>
          <span>${escapeHtml(p.name)}</span>
        </div>
        ${meta ? `<div class="flow-box-meta">${meta}</div>` : ""}
      </div>`;
    const arrow = i < pipes.length - 1 ? `<div class="flow-arrow">→</div>` : "";
    return box + arrow;
  }).join("");

  return `
    <div class="detail-grid">
      <div><div class="label">Layer</div><div class="value">${escapeHtml(capitalize(step.layer))}</div></div>
      <div><div class="label">Step</div><div class="value">${escapeHtml(step.name)} <span class="pill ${status}">${(status||"pending").toUpperCase()}</span></div></div>
      <div><div class="label">Pipes</div><div class="value">${pipes.length}</div></div>
      <div><div class="label">Total pipe duration</div><div class="value">${fmtDuration(totalMs || null)}</div></div>
      ${step.description ? `<div style="grid-column: 1 / -1;">
        <div class="label">Description</div>
        <div class="value" style="font-weight: 400; font-size: 13px; color: var(--text); line-height: 1.5;">${escapeHtml(step.description)}</div>
      </div>` : ""}
    </div>
    <div class="flow">${boxes || `<div class="empty">No pipes recorded yet.</div>`}</div>`;
}

function renderPipeDetail(step, pipe) {
  const pillClass = pipe.status;
  const pillText = (pipe.status || "pending").toUpperCase();
  let body = `
    <div class="detail-grid">
      <div><div class="label">Layer</div><div class="value">${escapeHtml(capitalize(step.layer))}</div></div>
      <div><div class="label">Result</div><div class="value"><span class="pill ${pillClass}">${pillText}</span></div></div>
      <div><div class="label">Parent step</div><div class="value">${escapeHtml(step.name)}</div></div>
      <div><div class="label">Pipe</div><div class="value">${escapeHtml(pipe.name)}</div></div>
      <div><div class="label">Duration</div><div class="value">${fmtDuration(pipe.durationMs)}</div></div>
      <div><div class="label">Order</div><div class="value">${pipe.order ?? "—"}</div></div>`;
  if (pipe.description) {
    body += `
      <div style="grid-column: 1 / -1;">
        <div class="label">Description</div>
        <div class="value" style="font-weight: 400; font-size: 13px; color: var(--text); line-height: 1.5;">${escapeHtml(pipe.description)}</div>
      </div>`;
  }
  if (pipe.rowsIn != null || pipe.rowsOut != null) {
    body += `
      <div><div class="label">Rows in</div><div class="value">${pipe.rowsIn?.toLocaleString() ?? "—"}</div></div>
      <div><div class="label">Rows out</div><div class="value">${pipe.rowsOut?.toLocaleString() ?? "—"}</div></div>`;
  }
  body += `</div>`;
  if (pipe.error) {
    body += `
      <div class="err-title">⚠ ERROR TRACE</div>
      <div class="err-box">${colorizeTraceback(pipe.error.traceback || "")}</div>`;
  }
  return body;
}

function renderLayerFlow(layer) {
  const steps = [...layer.steps.values()].sort((a,b)=>a.order-b.order);
  const totalMs = steps.reduce((sum, s) => sum + (s.durationMs ?? 0), 0);
  const status = layer.status;

  const boxes = steps.map((s, i) => {
    const meta = [
      s.durationMs != null ? fmtDuration(s.durationMs) : null,
      s.rowsIn != null ? `in ${s.rowsIn.toLocaleString()}` : null,
      s.rowsOut != null ? `out ${s.rowsOut.toLocaleString()}` : null,
    ].filter(Boolean).join(" · ");
    const hasPipes = s.pipes && s.pipes.size > 0;
    let pipesHtml = "";
    if (hasPipes) {
      const pipes = [...s.pipes.values()].sort((a,b)=>a.order-b.order);
      const pipeBoxes = pipes.map((p, j) => {
        const pmeta = [
          p.durationMs != null ? fmtDuration(p.durationMs) : null,
          p.rowsIn != null ? `in ${p.rowsIn.toLocaleString()}` : null,
          p.rowsOut != null ? `out ${p.rowsOut.toLocaleString()}` : null,
        ].filter(Boolean).join(" · ");
        const pbox = `
          <div class="flow-pipe ${p.status}" data-pipe-id="${escapeHtml(p.id)}" data-step-id="${escapeHtml(s.id)}" title="${escapeHtml(p.description || "")}">
            <div class="flow-pipe-head">
              <span class="dot ${p.status}"></span>
              <span>${escapeHtml(p.name)}</span>
            </div>
            ${pmeta ? `<div class="flow-pipe-meta">${pmeta}</div>` : ""}
          </div>`;
        const parrow = j < pipes.length - 1 ? `<div class="flow-pipe-arrow">→</div>` : "";
        return pbox + parrow;
      }).join("");
      pipesHtml = `<div class="flow-pipes">${pipeBoxes}</div>`;
    }
    return `
      <div class="flow-box ${s.status} ${hasPipes ? "has-pipes" : ""}" data-step-id="${escapeHtml(s.id)}" title="${escapeHtml(s.description || "")}">
        <div class="flow-box-head">
          <span class="dot ${s.status}"></span>
          <span>${escapeHtml(s.name)}</span>
          ${hasPipes ? `<span class="transform-badge">transform</span>` : ""}
        </div>
        ${meta ? `<div class="flow-box-meta">${meta}</div>` : ""}
        ${pipesHtml}
      </div>`;
  }).join("");

  return `
    <div class="detail-grid">
      <div><div class="label">Layer</div><div class="value">${escapeHtml(capitalize(layer.name))}</div></div>
      <div><div class="label">Result</div><div class="value"><span class="pill ${status}">${status.toUpperCase()}</span></div></div>
      <div><div class="label">Steps</div><div class="value">${steps.length}</div></div>
      <div><div class="label">Total duration</div><div class="value">${fmtDuration(totalMs || null)}</div></div>
    </div>
    <div class="flow">${boxes || `<div class="empty">No steps yet.</div>`}</div>`;
}

function capitalize(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function prettyKey(k) { return k.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase()); }
function formatVal(v) {
  if (v == null) return "—";
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

// Convert a stored path (Windows or POSIX) into a URL the local http server
// can serve. Returns null if the value doesn't look like a relative project path.
function pathToUrl(v) {
  if (typeof v !== "string") return null;
  if (!/[\/\\]/.test(v)) return null;
  if (/^https?:\/\//i.test(v)) return null;
  if (/^[A-Za-z]:[\/\\]/.test(v)) return null;  // absolute Windows path — not servable
  if (/^\//.test(v)) return null;               // absolute POSIX path
  return v.replace(/\\/g, "/").split("/").map(encodeURIComponent).join("/");
}

// HTML-safe value renderer that turns project-relative paths into clickable
// links that open the OS file explorer (handled by the custom server).
function formatValHtml(v) {
  if (v == null) return "—";
  if (typeof v === "object") return escapeHtml(JSON.stringify(v));
  const s = String(v);
  if (pathToUrl(s)) {
    return `<a href="#" class="path-link" data-open-path="${escapeHtml(s)}" title="Open in file explorer">${escapeHtml(s)}</a>`;
  }
  return escapeHtml(s);
}

function renderExecPicker() {
  const sel = document.getElementById("exec-picker");
  const cur = state.selectedExecId;
  sel.innerHTML = "";
  if (!state.executions.length) {
    const opt = document.createElement("option");
    opt.textContent = "(no executions yet)";
    sel.appendChild(opt);
    return;
  }
  for (const e of [...state.executions].reverse()) {
    const opt = document.createElement("option");
    opt.value = String(e.id);
    const when = e.started_at ? new Date(e.started_at).toLocaleTimeString() : "";
    opt.textContent = `#${e.id} · ${e.status} · ${when}`;
    if (e.id === cur) opt.selected = true;
    sel.appendChild(opt);
  }
}

// Detail-pane click delegate: path links + flow-box step selection +
// waterfall row drill-down + layer-summary boxes in the overview.
document.getElementById("detail").addEventListener("click", (e) => {
  const a = e.target.closest("a.path-link");
  if (a) {
    e.preventDefault();
    const p = a.dataset.openPath;
    if (!p) return;
    fetch(`/open?path=${encodeURIComponent(p)}`, { method: "GET" })
      .then(r => { if (!r.ok) console.warn("open failed:", r.status, r.statusText); })
      .catch(err => console.warn("open failed:", err));
    return;
  }
  const sbtn = e.target.closest(".sample-btn[data-sample-path]");
  if (sbtn) {
    loadParquetSample(sbtn.dataset.samplePath, sbtn.dataset.sampleKey, sbtn);
    return;
  }
  // Waterfall row drill-down — takes precedence over generic flow-box clicks
  // because wf-row elements have data-step-id / data-pipe-id too.
  const wfRow = e.target.closest(".wf-row[data-step-id], .wf-row[data-pipe-id]");
  if (wfRow) {
    state.selectedStepId = wfRow.dataset.stepId;
    state.selectedPipeId = wfRow.dataset.pipeId || null;
    state.selectedLayerOrder = null;
    renderRail(state.run);
    renderDetail(state.run);
    return;
  }
  // Layer-summary boxes in the run overview.
  const lbox = e.target.closest(".flow-box[data-layer-order]");
  if (lbox) {
    state.selectedLayerOrder = parseInt(lbox.dataset.layerOrder, 10);
    state.selectedStepId = null;
    state.selectedPipeId = null;
    renderRail(state.run);
    renderDetail(state.run);
    return;
  }
  const pbox = e.target.closest(".flow-box[data-pipe-id], .flow-pipe[data-pipe-id]");
  if (pbox) {
    state.selectedStepId = pbox.dataset.stepId;
    state.selectedPipeId = pbox.dataset.pipeId;
    state.selectedLayerOrder = null;
    renderRail(state.run);
    renderDetail(state.run);
    return;
  }
  const box = e.target.closest(".flow-box[data-step-id]");
  if (box) {
    state.selectedStepId = box.dataset.stepId;
    state.selectedPipeId = null;
    state.selectedLayerOrder = null;
    renderRail(state.run);
    renderDetail(state.run);
  }
});

document.getElementById("overview-btn").addEventListener("click", () => {
  state.selectedStepId = null;
  state.selectedPipeId = null;
  state.selectedLayerOrder = null;

});

document.getElementById("exec-picker").addEventListener("change", (e) => {
  const id = parseInt(e.target.value, 10);
  if (!isNaN(id)) {
    state.selectedExecId = id;
    state.selectedStepId = null;
    state.selectedPipeId = null;
    state.animatedLayers = new Set();
    state.run = null;
    pollRun();
  }
});

// ---------- polling ----------
async function pollIndex() {
  try {
    const data = await fetchJSON(`${LOGS_DIR}/index.json`);
    state.executions = data.executions || [];
    const curMaxId = state.executions.length
      ? state.executions[state.executions.length - 1].id
      : null;
    // Auto-jump to the latest run:
    //   * always on initial load (no selection yet)
    //   * when "Follow latest run" is ON and a strictly newer id has appeared
    const noSelection = state.selectedExecId == null;
    const newerAvailable =
      curMaxId != null && state.selectedExecId != null && curMaxId > state.selectedExecId;
    if (curMaxId != null && (noSelection || (state.followLatest && newerAvailable))) {
      state.selectedExecId = curMaxId;
      state.selectedStepId = null;
      state.selectedPipeId = null;
      state.animatedLayers = new Set();
      state.run = null;
      pollRun();
    } else if (state.run) {
      // Index refresh — re-render the overview so drift is recomputed against
      // the latest set of executions (a new sibling run may have appeared
      // since the last poll, changing what "previous run" means).
      renderDetail(state.run);
    }
    renderExecPicker();
  } catch (_) {
    // file missing or unreachable; stay silent
  }
}

async function pollRun() {
  if (state.selectedExecId == null) return;
  const e = state.executions.find(x => x.id === state.selectedExecId);
  if (!e) return;
  try {
    const events = await fetchJSONL(`${LOGS_DIR}/${e.file}`);
    // Usage samples live in a sibling file: replace `-info.jsonl` with
    // `-usage.jsonl`. Tolerate it being absent (older runs / no psutil).
    const usageFile = e.file.replace(/-info\.jsonl$/, "-usage.jsonl");
    const samples = await fetchJSONL(`${LOGS_DIR}/${usageFile}`).catch(() => []);
    state.run = buildRunModel(events);
    state.usage = samples;
    renderHeader(state.run);
    renderUsage(state.usage);
    renderRail(state.run);
    renderDetail(state.run);
  } catch (_) {
    // ignore transient errors
  }
}

function renderUsage(samples) {
  renderUsageDock(samples || []);
}

// ---------- Usage dock ----------
function renderLineChart(svg, samples, valueFn, opts = {}) {
  const W = 460, H = 200, padL = 38, padR = 8, padT = 10, padB = 22;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const color = opts.color || "var(--orange)";
  const unit = opts.unit || "";

  if (!samples || !samples.length) {
    svg.innerHTML = `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#7d8590" font-size="12" font-style="italic">No samples yet — run the pipeline.</text>`;
    return;
  }

  const values = samples.map(valueFn).map(v => v == null ? 0 : v);
  const dataMax = Math.max(...values, opts.minMax ?? 1);
  // Always show 0 at bottom; if `max` is given, use it as a fixed cap
  // (good for percentages); otherwise round the data max up to a nice number.
  const max = opts.max != null ? opts.max : niceCeil(dataMax * 1.1);
  const min = 0;

  const xStep = samples.length > 1 ? innerW / (samples.length - 1) : 0;
  const yScale = (v) => padT + innerH - ((v - min) / (max - min)) * innerH;

  // Build polyline (or smoothed cubic curve) + filled area path.
  const points = samples.map((s, i) => {
    const v = valueFn(s) ?? 0;
    const x = padL + i * xStep;
    const y = yScale(v);
    return [parseFloat(x.toFixed(1)), parseFloat(y.toFixed(1))];
  });
  const linePath = state.chartSmoothing
    ? smoothPath(points)
    : points.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
  const baseY = (padT + innerH).toFixed(1);
  const lastX = points[points.length - 1][0];
  const firstX = points[0][0];
  const areaPath = linePath + ` L${lastX},${baseY} L${firstX},${baseY} Z`;

  // Y gridlines + labels (5 ticks).
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * (i / 4);
    const y = yScale(v).toFixed(1);
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#2a313c" stroke-width="0.5" opacity="0.7"/>`;
    grid += `<text x="${padL - 6}" y="${(parseFloat(y) + 3).toFixed(1)}" text-anchor="end" fill="#7d8590" font-size="9" font-family="ui-monospace, monospace">${formatTick(v)}${unit}</text>`;
  }

  // X axis: a few timestamp labels.
  let xLabels = "";
  if (samples.length > 1) {
    const tickCount = Math.min(4, samples.length);
    for (let i = 0; i < tickCount; i++) {
      const idx = Math.round((samples.length - 1) * (i / (tickCount - 1)));
      const x = (padL + idx * xStep).toFixed(1);
      const t = samples[idx].ts ? new Date(samples[idx].ts).toLocaleTimeString() : `${idx}s`;
      xLabels += `<text x="${x}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === tickCount - 1 ? "end" : "middle"}" fill="#7d8590" font-size="9" font-family="ui-monospace, monospace">${t}</text>`;
    }
  }

  svg.innerHTML = `
    ${grid}
    <path d="${areaPath}" fill="${color}" opacity="0.18"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
    ${xLabels}
  `;
}

// Catmull-Rom → cubic Bézier conversion. Produces a smooth path through all
// the given points. `tension` ≈ 0.2 gives a gentle curve without overshoot.
function smoothPath(points, tension = 0.2) {
  if (points.length < 2) return "";
  if (points.length === 2) {
    return `M${points[0][0]},${points[0][1]} L${points[1][0]},${points[1][1]}`;
  }
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const cp1x = p1[0] + (p2[0] - p0[0]) * tension;
    const cp1y = p1[1] + (p2[1] - p0[1]) * tension;
    const cp2x = p2[0] - (p3[0] - p1[0]) * tension;
    const cp2y = p2[1] - (p3[1] - p1[1]) * tension;
    d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function niceCeil(v) {
  if (v <= 0) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / pow;
  let nice;
  if (norm <= 1) nice = 1;
  else if (norm <= 2) nice = 2;
  else if (norm <= 5) nice = 5;
  else nice = 10;
  return nice * pow;
}

function formatTick(v) {
  if (v >= 1000) return (v / 1000).toFixed(1) + "k";
  if (v >= 10) return v.toFixed(0);
  return v.toFixed(1);
}

function renderUsageDock(samples) {
  // CPU
  renderLineChart(
    document.getElementById("cpu-chart"),
    samples,
    s => s.cpu_proc_pct,
    { color: "#3fb950", unit: "%", minMax: 10 },
  );
  document.getElementById("cpu-stats").innerHTML = samples.length
    ? `<span>Peak <strong>${Math.max(...samples.map(s => s.cpu_proc_pct ?? 0)).toFixed(1)}%</strong></span>
       <span>Avg <strong>${(samples.reduce((a, s) => a + (s.cpu_proc_pct ?? 0), 0) / samples.length).toFixed(1)}%</strong></span>
       <span>System peak <strong>${Math.max(...samples.map(s => s.cpu_system_pct ?? 0)).toFixed(1)}%</strong></span>
       <span>Samples <strong>${samples.length}</strong></span>`
    : `<span>Run the pipeline to populate.</span>`;

  // Memory (system %) — capped at 100 on the y-axis.
  renderLineChart(
    document.getElementById("mem-chart"),
    samples,
    s => s.mem_system_pct,
    { color: "#bc8cff", unit: "%", max: 100 },
  );
  document.getElementById("mem-stats").innerHTML = samples.length
    ? `<span>Peak <strong>${Math.max(...samples.map(s => s.mem_system_pct ?? 0)).toFixed(1)}%</strong></span>
       <span>Avg <strong>${(samples.reduce((a, s) => a + (s.mem_system_pct ?? 0), 0) / samples.length).toFixed(1)}%</strong></span>
       <span>Process peak <strong>${Math.max(...samples.map(s => s.mem_proc_rss_mb ?? 0)).toFixed(0)} MB</strong></span>
       <span>Samples <strong>${samples.length}</strong></span>`
    : `<span>Run the pipeline to populate.</span>`;

  // Disk KPI
  const diskEl = document.getElementById("disk-kpi");
  const lastDisk = [...samples].reverse().find(s => s.disk_free_gb != null);
  if (lastDisk) {
    const free = lastDisk.disk_free_gb;
    const total = lastDisk.disk_total_gb;
    const used = Math.max(0, total - free);
    const pct = lastDisk.disk_used_pct;
    diskEl.innerHTML = `
      <div class="disk-bar">
        <div class="disk-bar-fill" style="width: ${pct.toFixed(1)}%"></div>
        <div class="disk-bar-label">${pct.toFixed(1)}% used</div>
      </div>
      <div class="disk-num-row">
        <div class="disk-num"><div class="label">Free</div><div class="value">${free.toFixed(1)} GB</div></div>
        <div class="disk-num"><div class="label">Used</div><div class="value">${used.toFixed(1)} GB</div></div>
        <div class="disk-num"><div class="label">Total</div><div class="value">${total.toFixed(1)} GB</div></div>
      </div>
    `;
  } else {
    diskEl.innerHTML = `<div class="usage-empty">No disk samples yet.</div>`;
  }
}

// Dock toggle + tab switching, with localStorage persistence.
const USAGE_DOCK_OPEN_KEY = "viewer.usageDock.open";
const USAGE_DOCK_TAB_KEY = "viewer.usageDock.tab";
if (localStorage.getItem(USAGE_DOCK_OPEN_KEY) === "1") {
  document.getElementById("usage-dock").classList.add("open");
}
document.getElementById("usage-dock-toggle").addEventListener("click", () => {
  const dock = document.getElementById("usage-dock");
  const open = dock.classList.toggle("open");
  localStorage.setItem(USAGE_DOCK_OPEN_KEY, open ? "1" : "0");
});

function selectUsageTab(name) {
  document.querySelectorAll(".usage-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".usage-pane").forEach(p => p.classList.toggle("active", p.dataset.pane === name));

document.querySelectorAll(".usage-tab").forEach(btn => {

});
const savedTab = localStorage.getItem(USAGE_DOCK_TAB_KEY);

// ---------- config (theme + font size + follow + smoothing) ----------
const THEME_KEY = "viewer.theme";
const FSZ_KEY = "viewer.fontSize";
const FOLLOW_KEY = "viewer.followLatest";
const SMOOTH_KEY = "viewer.chartSmoothing";
const CONFIG_COLLAPSED_KEY = "viewer.config.collapsed";

function applyTheme(t) {
  document.body.classList.toggle("theme-light", t === "light");
  document.querySelectorAll(".seg[data-theme]").forEach(b =>
    b.classList.toggle("active", b.dataset.theme === t),
  );
  localStorage.setItem(THEME_KEY, t);
}

function applyFontSize(z) {
  document.body.classList.remove("fsz-sm", "fsz-md", "fsz-lg");
  document.body.classList.add("fsz-" + z);
  document.querySelectorAll(".seg[data-fsz]").forEach(b =>
    b.classList.toggle("active", b.dataset.fsz === z),
  );
  localStorage.setItem(FSZ_KEY, z);
}

function applyFollow(v) {
  state.followLatest = v === "on";
  document.querySelectorAll(".seg[data-follow]").forEach(b =>
    b.classList.toggle("active", b.dataset.follow === v),
  );
  localStorage.setItem(FOLLOW_KEY, v);
}

function applySmooth(v) {
  state.chartSmoothing = v === "on";
  document.querySelectorAll(".seg[data-smooth]").forEach(b =>
    b.classList.toggle("active", b.dataset.smooth === v),
  );
  localStorage.setItem(SMOOTH_KEY, v);
  // Re-render charts immediately so the change is visible without waiting for the next poll.
  if (state.usage && state.usage.length) renderUsageDock(state.usage);
}

applyTheme(localStorage.getItem(THEME_KEY) || "dark");
applyFontSize(localStorage.getItem(FSZ_KEY) || "md");
applyFollow(localStorage.getItem(FOLLOW_KEY) || "on");
applySmooth(localStorage.getItem(SMOOTH_KEY) || "off");
if (localStorage.getItem(CONFIG_COLLAPSED_KEY) === "1") {

}

document.querySelectorAll(".seg[data-theme]").forEach(b => {

document.querySelectorAll(".seg[data-fsz]").forEach(b => {
  b.addEventListener("click", () => applyFontSize(b.dataset.fsz));
});
document.querySelectorAll(".seg[data-follow]").forEach(b => {
  b.addEventListener("click", () => applyFollow(b.dataset.follow));
});
document.querySelectorAll(".seg[data-smooth]").forEach(b => {
  b.addEventListener("click", () => applySmooth(b.dataset.smooth));
});
document.getElementById("config-toggle").addEventListener("click", () => {
  const sec = document.getElementById("config-section");
  const collapsed = sec.classList.toggle("collapsed");
  localStorage.setItem(CONFIG_COLLAPSED_KEY, collapsed ? "1" : "0");
});

// ---------- right actions sidebar ----------
const ACTIONS_COLLAPSED_KEY = "viewer.actions.collapsed";
if (localStorage.getItem(ACTIONS_COLLAPSED_KEY) === "1") {
  document.body.classList.add("actions-collapsed");
}
document.getElementById("actions-toggle").addEventListener("click", () => {
  const collapsed = document.body.classList.toggle("actions-collapsed");
  localStorage.setItem(ACTIONS_COLLAPSED_KEY, collapsed ? "1" : "0");
});

document.querySelectorAll(".run-btn").forEach((btn) => {
  btn.addEventListener("click", async () => {
    if (btn.classList.contains("busy")) return;
    const layer = btn.dataset.layer;
    const statusEl = document.getElementById("run-status");
    btn.classList.add("busy");
    statusEl.textContent = `Spawning ${layer}…`;
    try {
      const res = await fetch(`/run?layer=${encodeURIComponent(layer)}`, { method: "GET" });
      if (!res.ok) {
        statusEl.textContent = `Failed (${res.status} ${res.statusText})`;
      } else {
        statusEl.textContent = `Launched ${layer} in a new window.`;
      }
    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
    } finally {
      setTimeout(() => btn.classList.remove("busy"), 800);
    }
  });
});

pollIndex();
pollRun();
setInterval(pollIndex, POLL_INDEX_MS);
setInterval(pollRun, POLL_RUN_MS);
